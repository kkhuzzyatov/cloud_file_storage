server:
  port: 8080
  servlet:
    session:
      cookie:
        name: SESSION

spring:
  application:
    name: cloud-file-storage

  datasource:
    url: jdbc:postgresql://localhost:5432/storage
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    enabled: true
    change-log: classpath:/migrations/master.xml

  session:
    store-type: redis

  data:
    redis:
      host: localhost
      port: 6379

app:
  data-dir-path: data

  token:
    ttl: 7d